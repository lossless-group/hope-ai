# tracker.yaml — your PSP as numbers. One per person.
# Field reference: references/dashboard-guidelines.md
# Pacing (base, stretch, milestones): references/goal-pacing.md
#
# Each goal is its process habits: the things you do, scored every week.
# Two shapes: frequency checks (did it happen, how many times) and
# quantities (minutes, dollars). Four cadences: daily, weekly, biweekly
# (every two weeks), monthly (Weeks 1–4, 5–8, 9–12, 13–15).
# Outcomes are what the habits move: read every week, scored at Day 30/60/90.
#
# The program's goals: three Personal, a fourth that is Creative, and a fifth
# that is Relationships. The example below shows one goal with every cadence;
# copy the block for each of yours.

person: Your Name
cohort: LV___
day_one: 2026-01-05          # Day 1 of your 100 days (any weekday)
week_starts: sunday          # the cohort's week: Sunday to Saturday, form due Sunday afternoon
length_days: 100
checkpoints: [30, 60, 90]
deload_weeks: [8, 12]

goals:
  - id: goal-1
    number: 1
    kind: Personal            # Personal (goals 1–3) | Creative (4) | Relationships (5)
    area: ___                 # e.g. Body, Income, People
    title: ___                # the one-line goal from your plan
    process:                  # leading indicators: scored every week
      - id: daily-check
        label: ___            # a daily yes/no habit
        cadence: daily
        measure: check        # check | count | minutes | hours | amount
        base: 5               # days hit in a good-enough week
        stretch: 7            # days hit in a great week
      - id: daily-minutes
        label: ___ (minutes)  # a daily quantity
        cadence: daily
        measure: minutes
        base: 60              # minutes per week
        stretch: 140
      - id: weekly-count
        label: ___            # a weekly habit that ramps
        cadence: weekly
        measure: count
        base: 1
        stretch: 2
        weeks:                # overrides carry forward from that week
          4: { base: 2, stretch: 3 }
          8: { base: 1, stretch: 1 }    # deload
          9: { base: 2, stretch: 3 }
      - id: weekly-limit
        label: ___            # a "no more than" habit
        cadence: weekly
        measure: count
        direction: down       # lower is better
        stretch: 3            # the limit
      - id: weekly-longest
        label: ___ (hours)    # something continuous, e.g. a fast: the week's longest counts
        cadence: weekly
        measure: hours
        aggregate: max        # best single entry, not the sum
        base: 24
        stretch: 36
      - id: every-two-weeks
        label: ___            # scored over Weeks 1–2, 3–4, …
        cadence: biweekly
        measure: count
        base: 1               # per two weeks
        stretch: 2
      - id: monthly-check
        label: ___            # scored over Weeks 1–4, 5–8, 9–12, 13–15
        cadence: monthly
        measure: check
        base: 1               # per four weeks
        stretch: 1
    outcomes:                 # lagging indicators: a reading every week, scored at Day 30/60/90
      - id: outcome-a
        label: ___
        unit: ___
        direction: up         # up | down
        baseline: null        # { date: 2026-01-05, value: 0 } once measured
        milestones: {}        # e.g. { 30: [lo, hi], 60: [lo, hi], 90: [lo, hi] }
      - id: outcome-b
        label: ___ (0–10)     # a feeling or rating you watch but don't score
        direction: up
        baseline: null
        track_only: true

  # - id: goal-2 … (repeat for each goal on your form)
